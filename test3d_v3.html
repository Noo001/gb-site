<!DOCTYPE html>
<html><head><style>
body { margin:0; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; }
.pc-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; max-width: 1500px; width: 100%; padding: 2rem; }
.pc-wizard { min-width: 0; }
.pc-case-panel { display: flex; flex-direction: column; align-items: center; }
.pc-case-scene { perspective: 1400px; display: flex; justify-content: center; padding: 2rem 0; min-height: 780px; filter: drop-shadow(0 24px 48px rgba(0,0,0,0.14)); }
.pc-case-3d { width: 500px; height: 700px; position: relative; transform-style: preserve-3d; transform: rotateY(-35deg) rotateX(10deg); transition: transform 0.6s ease; will-change: transform; }
.pc-case-face { position: absolute; top: 50%; left: 50%; backface-visibility: visible; box-sizing: border-box; border: 2px solid #6b7280; }
.pc-case-face--front { width: 500px; height: 700px; transform: translateX(-50%) translateY(-50%) translateZ(55px); background: transparent; border: none; overflow: hidden; border-radius: 18px; }
.pc-case-face--back { width: 500px; height: 700px; transform: translateX(-50%) translateY(-50%) rotateY(180deg) translateZ(55px); background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%); border-radius: 18px; }
.pc-case-face--left { width: 110px; height: 700px; transform: translateX(-50%) translateY(-50%) rotateY(-90deg) translateZ(250px); background: linear-gradient(180deg, #e5e7eb 0%, #c8cdd5 100%); border-radius: 18px; }
.pc-case-face--right { width: 110px; height: 700px; transform: translateX(-50%) translateY(-50%) rotateY(90deg) translateZ(250px); background: linear-gradient(180deg, #d1d5db 0%, #9ca3af 100%); border-radius: 18px; }
.pc-case-face--top { width: 500px; height: 110px; transform: translateX(-50%) translateY(-50%) rotateX(90deg) translateZ(350px); background: linear-gradient(135deg, #f3f4f6 0%, #d1d5db 100%); border-radius: 18px; }
.pc-case-face--bottom { width: 500px; height: 110px; transform: translateX(-50%) translateY(-50%) rotateX(-90deg) translateZ(350px); background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%); border-radius: 18px; }
.pc-case-svg { width: 100%; height: 100%; display: block; }
.pc-slot { cursor: pointer; }
.pc-slot .pc-shape { fill: rgba(12, 192, 223, 0.22); stroke: #374151; stroke-width: 2.5; stroke-dasharray: 5 4; transition: fill 0.35s, stroke 0.35s; }
.pc-slot .pc-case-body { fill: #f3f4f6; }
.pc-slot:hover .pc-shape { stroke: #0cc0df; stroke-dasharray: none; fill: rgba(12, 192, 223, 0.30); }
.pc-detail { fill: #fff; stroke: #4b5563; stroke-width: 2; }
.pc-detail-line { stroke: #4b5563; stroke-width: 2; fill: none; }
.pc-trace { stroke: #9ca3af; stroke-width: 2; fill: none; }
.pc-fan-ring { fill: none; }
.pc-fan-blades path { fill: none; stroke: #4b5563; stroke-width: 2.5; }
.pc-glass { fill: rgba(255, 255, 255, 0.35); stroke: rgba(0, 0, 0, 0.15); stroke-width: 1.5; pointer-events: none; }
.pc-glass-glare { fill: rgba(255, 255, 255, 0.25); pointer-events: none; }
.pc-led { fill: url(#pcLedGrad); }
.pc-slot-label { fill: #1a1a1a; font-size: 15px; font-weight: 600; pointer-events: none; }
:root { --accent: #0cc0df; }
</style></head>
<body>
<div class="pc-layout">
<div class="pc-wizard">Контент слева</div>
<div class="pc-case-panel">
<div class="pc-case-scene">
<div class="pc-case-3d">
<div class="pc-case-face pc-case-face--front">
<svg class="pc-case-svg" viewBox="90 70 280 390" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="pcLedGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/></linearGradient></defs>
<g class="pc-slot pc-slot-case" data-slot="case"><rect class="pc-shape pc-case-body" x="90" y="70" width="280" height="390" rx="10"/><rect class="pc-led" x="99" y="82" width="4" height="366" rx="2"/></g>
<g class="pc-slot" data-slot="motherboard"><rect class="pc-shape pc-mb" x="120" y="100" width="175" height="245" rx="4"/><rect class="pc-detail pc-io" x="125" y="105" width="22" height="48" rx="2"/><line class="pc-trace" x1="212" y1="130" x2="290" y2="130"/><line class="pc-trace" x1="212" y1="215" x2="292" y2="215"/><line class="pc-trace" x1="132" y1="220" x2="132" y2="335"/><line class="pc-trace" x1="190" y1="290" x2="290" y2="290"/></g>
<g class="pc-slot" data-slot="cpu"><rect class="pc-shape" x="150" y="120" width="52" height="52" rx="4"/><rect class="pc-detail" x="158" y="128" width="36" height="36" rx="2"/></g>
<g class="pc-slot" data-slot="ram"><rect class="pc-shape" x="250" y="112" width="11" height="95" rx="2"/><rect class="pc-shape" x="267" y="112" width="11" height="95" rx="2"/><rect class="pc-detail" x="252" y="117" width="7" height="22"/><rect class="pc-detail" x="252" y="144" width="7" height="22"/><rect class="pc-detail" x="252" y="171" width="7" height="22"/><rect class="pc-detail" x="269" y="117" width="7" height="22"/><rect class="pc-detail" x="269" y="144" width="7" height="22"/><rect class="pc-detail" x="269" y="171" width="7" height="22"/></g>
<g class="pc-slot" data-slot="gpu"><rect class="pc-shape pc-gpu" x="125" y="230" width="190" height="38" rx="4"/><rect class="pc-detail" x="125" y="268" width="190" height="5"/><circle class="pc-detail pc-fan-ring" cx="165" cy="249" r="12"/><line class="pc-detail-line" x1="165" y1="240" x2="165" y2="258"/><line class="pc-detail-line" x1="156" y1="249" x2="174" y2="249"/><circle class="pc-detail pc-fan-ring" cx="215" cy="249" r="12"/><line class="pc-detail-line" x1="215" y1="240" x2="215" y2="258"/><line class="pc-detail-line" x1="206" y1="249" x2="224" y2="249"/></g>
<rect class="pc-glass" x="105" y="85" width="240" height="350" rx="6"/>
</svg>
</div>
<div class="pc-case-face pc-case-face--back"></div>
<div class="pc-case-face pc-case-face--top"></div>
<div class="pc-case-face pc-case-face--bottom"></div>
<div class="pc-case-face pc-case-face--left"></div>
<div class="pc-case-face pc-case-face--right"></div>
</div>
</div>
</div>
</div>
</body></html>
