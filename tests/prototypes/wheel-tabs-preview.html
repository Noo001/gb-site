<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Tabs</title>
<link rel="stylesheet" href="../../api/public/css/site.css">
<style>
  body { background:#f5f5f5; padding:2rem; }
  .preview-container { max-width:1000px; margin:0 auto; background:#fff; border-radius:1rem; padding:2rem; }
</style>
</head>
<body>
<div class="preview-container" x-data="{ variant: 'pole', spinning: false }">
  <h2 class="section-title">Колесо фортуны</h2>
  <div class="wheel-tabs">
    <button class="wheel-tab" :class="{ active: variant === 'pole' }" @click="variant='pole'">Поле чудес 3D</button>
    <button class="wheel-tab" :class="{ active: variant === 'market' }" @click="variant='market'">Маркетплейс</button>
    <button class="wheel-tab" :class="{ active: variant === 'neon' }" @click="variant='neon'">Neon Fusion</button>
  </div>
  <div class="roulette-layout">
    <div class="pc-wheel-stage" x-show="variant === 'pole'" x-cloak>
      <div class="pc-wheel-spotlight"></div>
      <div class="pc-wheel-3d" id="poleWheel" style="transform: rotateX(62deg) rotateZ(28deg) rotateY(-6deg);">
        <svg class="pc-wheel-svg" viewBox="0 0 420 420" id="poleSvg">
          <defs>
            <radialGradient id="pcWheelGold" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff8db"/>
              <stop offset="35%" stop-color="#e5c86c"/>
              <stop offset="100%" stop-color="#6b5410"/>
            </radialGradient>
          </defs>
          <circle cx="210" cy="210" r="206" fill="url(#pcWheelGold)" opacity="0.95"/>
        </svg>
        <div class="pc-wheel-hub">GO</div>
        <div class="pc-wheel-pointer">
          <svg viewBox="0 0 130 130" fill="none">
            <path d="M130 65L15 0V130L130 65Z" fill="url(#pcWheelPointerGrad)"/>
            <defs><linearGradient id="pcWheelPointerGrad" x1="130" y1="65" x2="15" y2="65"><stop stop-color="#ffd700"/><stop offset="1" stop-color="#ff3d00"/></linearGradient></defs>
            <circle cx="88" cy="65" r="8" fill="#fff" stroke="#ff3d00" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="market-wheel-stage" x-show="variant === 'market'" x-cloak>
      <div class="market-wheel-rim"></div>
      <canvas id="marketWheel" width="420" height="420" class="market-wheel"></canvas>
      <div class="market-wheel-center">GO</div>
      <div class="market-pointer">
        <svg viewBox="0 0 44 60" fill="none">
          <path d="M22 0L44 48H0L22 0Z" fill="#ff3d00"/>
          <path d="M22 48L14 60H30L22 48Z" fill="#ffd700"/>
          <circle cx="22" cy="18" r="5" fill="#fff"/>
        </svg>
      </div>
    </div>

    <div class="neon-wheel-stage" x-show="variant === 'neon'" x-cloak>
      <div class="neon-bg-grid"></div>
      <div class="neon-glow-ring"></div>
      <div class="neon-outer-ring"></div>
      <div class="neon-wheel-bg"></div>
      <canvas id="neonWheel" width="420" height="420" class="neon-wheel"></canvas>
      <div class="neon-center-hub">SPIN</div>
      <div class="neon-pointer">
        <svg viewBox="0 0 40 56" fill="none">
          <path d="M20 56L0 16H40L20 56Z" fill="#ff7b00"/>
          <path d="M20 0L0 16H40L20 0Z" fill="#fff"/>
        </svg>
      </div>
    </div>

    <div class="roulette-controls">
      <p class="roulette-info">Бесплатных прокруток: <strong>3</strong></p>
      <p class="roulette-info">Стоимость платной прокрутки: <strong>10</strong> бонусов</p>
      <div class="roulette-buttons">
        <button class="btn btn-outline roulette-btn-free" onclick="spin()">Бесплатная прокрутка</button>
        <button class="btn btn-primary roulette-btn-paid" onclick="spin()">Прокрутить за 10 бонусов</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
const sectors = [
  { label: '+50' }, { label: '+100' }, { label: '+25' }, { label: 'Free spin' },
  { label: '+500' }, { label: '+10' }, { label: 'Jackpot' }, { label: '+200' }
];
const sectorColors = ['#111','#f5f0e1','#111','#f5f0e1','#c41e3a','#f5f0e1','#111','#f5f0e1'];
const marketColors = ['#0cc0df','#ff7b00','#10b981','#ef4444','#8b5cf6','#f59e0b','#3b82f6','#ec4899'];
const neonColors = ['#0cc0df','#ff7b00','#10b981','#ef4444','#8b5cf6','#f59e0b','#3b82f6','#ec4899'];

drawPole(); drawMarket(); drawNeon();

function truncate(t,m){ return t.length>m?t.slice(0,m-1)+'…':t; }
function darken(hex, amount){
  const num=parseInt(hex.slice(1),16);
  let r=Math.max(0,(num>>16)-amount), g=Math.max(0,((num>>8)&255)-amount), b=Math.max(0,(num&255)-amount);
  return `rgb(${r},${g},${b})`;
}

function drawPole(){
  const svg=document.getElementById('poleSvg');
  svg.querySelectorAll('.pc-wheel-sector,.pc-wheel-text').forEach(el=>el.remove());
  const size=420,cx=size/2,cy=size/2,rOut=size/2-8,rIn=55,n=sectors.length,angle=(Math.PI*2)/n;
  function path(i){
    const start=i*angle-Math.PI/2,end=start+angle;
    const x1=cx+rIn*Math.cos(start),y1=cy+rIn*Math.sin(start);
    const x2=cx+rOut*Math.cos(start),y2=cy+rOut*Math.sin(start);
    const x3=cx+rOut*Math.cos(end),y3=cy+rOut*Math.sin(end);
    const x4=cx+rIn*Math.cos(end),y4=cy+rIn*Math.sin(end);
    return `M ${x1} ${y1} L ${x2} ${y2} A ${rOut} ${rOut} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${rIn} ${rIn} 0 0 0 ${x1} ${y1} Z`;
  }
  sectors.forEach((s,i)=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',path(i)); p.setAttribute('fill',sectorColors[i]); p.setAttribute('class','pc-wheel-sector'); svg.appendChild(p);
    const mid=i*angle+angle/2-Math.PI/2,tr=(rIn+rOut)/2+2,tx=cx+tr*Math.cos(mid),ty=cy+tr*Math.sin(mid);
    let ta=(mid*180/Math.PI)+90; const norm=((mid+Math.PI*2.5)%(Math.PI*2)); if(norm>Math.PI/2&&norm<3*Math.PI/2) ta+=180;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',tx); t.setAttribute('y',ty); t.setAttribute('class','pc-wheel-text');
    t.setAttribute('fill',sectorColors[i]==='#f5f0e1'?'#111':'#fff');
    t.setAttribute('transform',`rotate(${ta}, ${tx}, ${ty})`); t.textContent=truncate(s.label,16); svg.appendChild(t);
  });
}

function drawMarket(){
  const canvas=document.getElementById('marketWheel'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1,size=420; canvas.width=size*dpr; canvas.height=size*dpr;
  canvas.style.width=size+'px'; canvas.style.height=size+'px'; ctx.scale(dpr,dpr);
  const cx=size/2,cy=size/2,r=size/2-16,n=sectors.length,a=(Math.PI*2)/n;
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<n;i++){
    const start=i*a,end=start+a; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r); grad.addColorStop(0,marketColors[i]); grad.addColorStop(1,darken(marketColors[i],30));
    ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(start+a/2); ctx.textAlign='right'; ctx.fillStyle='#fff';
    ctx.font='bold 13px Inter, sans-serif'; ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=4;
    ctx.fillText(truncate(sectors[i].label,18),r-18,5); ctx.restore();
  }
}

function drawNeon(){
  const canvas=document.getElementById('neonWheel'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1,size=420; canvas.width=size*dpr; canvas.height=size*dpr;
  canvas.style.width=size+'px'; canvas.style.height=size+'px'; ctx.scale(dpr,dpr);
  const cx=size/2,cy=size/2,r=size/2-16,n=sectors.length,a=(Math.PI*2)/n;
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<n;i++){
    const start=i*a,end=start+a; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r); const base=neonColors[i];
    grad.addColorStop(0,base+'55'); grad.addColorStop(0.6,base+'aa'); grad.addColorStop(1,base);
    ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(start+a/2); ctx.textAlign='right'; ctx.fillStyle='#fff';
    ctx.font='bold 15px Inter, sans-serif'; ctx.shadowColor=base; ctx.shadowBlur=12;
    ctx.fillText(truncate(sectors[i].label,16),r-22,5); ctx.restore();
  }
}

let rotation={pole:0,market:0,neon:0};
function spin(){
  const variant=document.querySelector('.wheel-tab.active').textContent.includes('Поле')?'pole':
                 document.querySelector('.wheel-tab.active').textContent.includes('Маркет')?'market':'neon';
  const idx=Math.floor(Math.random()*sectors.length);
  const sectorAngle=360/sectors.length;
  const target=idx*sectorAngle+sectorAngle/2+(Math.random()*(sectorAngle-8)-(sectorAngle-8)/2);
  if(variant==='pole'){
    rotation.pole+=6*360+(90-target-(rotation.pole%360));
    document.getElementById('poleWheel').style.transform=`rotateX(62deg) rotateZ(28deg) rotateY(-6deg) rotateZ(${rotation.pole}deg)`;
  } else if(variant==='market'){
    rotation.market+=6*360+(270-target-(rotation.market%360));
    document.getElementById('marketWheel').style.transition='transform 5s cubic-bezier(0.12,0.68,0.18,0.99)';
    document.getElementById('marketWheel').style.transform=`rotate(${rotation.market}deg)`;
  } else {
    rotation.neon+=6*360+(270-target-(rotation.neon%360));
    document.getElementById('neonWheel').style.transition='transform 5.5s cubic-bezier(0.12,0.75,0.18,1)';
    document.getElementById('neonWheel').style.transform=`rotate(${rotation.neon}deg)`;
  }
}
</script>
</body>
</html>
