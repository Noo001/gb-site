<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо фортуны — Neon Fusion</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #05050a;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -2;
    background-image:
      linear-gradient(rgba(12, 192, 223, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(12, 192, 223, 0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(800px) rotateX(60deg) translateY(-100px) scale(2);
    opacity: 0.35;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 60px; } }
  h1 { font-weight: 900; font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: 0.08em; margin: 0 0 0.4rem; text-transform: uppercase; background: linear-gradient(90deg, #0cc0df, #ff7b00, #0cc0df); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textGlow 4s linear infinite; }
  @keyframes textGlow { to { background-position: 200% center; } }
  .subtitle { color: #8a8aa5; margin-bottom: 2rem; text-align: center; }
  .stage {
    position: relative;
    width: 460px; height: 460px;
    max-width: 90vw; max-height: 90vw;
    display: flex; align-items: center; justify-content: center;
  }
  .glow-ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #0cc0df, #ff7b00, #0cc0df);
    filter: blur(24px); opacity: 0.55;
    animation: ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse { 0%,100%{ transform: scale(1); opacity:.5; } 50%{ transform: scale(1.05); opacity:.7; } }
  .outer-ring {
    position: absolute; inset: 8px; border-radius: 50%;
    background: conic-gradient(from 0deg, #0cc0df, #ff7b00, #10b981, #8b5cf6, #0cc0df);
    box-shadow: 0 0 40px rgba(12, 192, 223, 0.35);
  }
  .wheel {
    position: absolute; inset: 22px; border-radius: 50%;
    background: rgba(10,10,18,0.92);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 0 60px rgba(12, 192, 223, 0.25);
  }
  .center-hub {
    position: absolute; top: 50%; left: 50%; width: 92px; height: 92px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(12,192,223,0.9) 0%, rgba(5,5,10,0.95) 70%);
    border: 2px solid rgba(12,192,223,0.8);
    box-shadow: 0 0 30px rgba(12,192,223,0.6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.9rem; letter-spacing: 0.05em;
    z-index: 5;
  }
  .pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 56px; z-index: 10;
    filter: drop-shadow(0 0 12px #ff7b00);
  }
  .pointer svg { width: 100%; height: 100%; }
  canvas { position: absolute; inset: 22px; border-radius: 50%; z-index: 3; }
  .controls { margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  button {
    border: none; padding: 1rem 2.2rem; border-radius: 999px; font-size: 1rem; font-weight: 900; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.06em;
    position: relative; overflow: hidden;
  }
  .spin {
    background: linear-gradient(135deg, #0cc0df, #ff7b00); color: #fff;
    box-shadow: 0 0 24px rgba(12, 192, 223, 0.45), 0 0 24px rgba(255, 123, 0, 0.25);
  }
  .spin:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 36px rgba(12, 192, 223, 0.6), 0 0 36px rgba(255, 123, 0, 0.4); }
  .spin::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: rotate(25deg) translateX(-100%); transition: transform 0.6s;
  }
  .spin:hover::before { transform: rotate(25deg) translateX(100%); }
  .free { background: transparent; color: #0cc0df; border: 2px solid #0cc0df; }
  .free:hover { background: rgba(12,192,223,0.1); box-shadow: 0 0 24px rgba(12,192,223,0.3); }
  .message { margin-top: 1.5rem; min-height: 1.5em; font-weight: 800; font-size: 1.1rem; text-align: center; color: #0cc0df; text-shadow: 0 0 12px rgba(12,192,223,0.6); }
  @media (max-width: 480px) { .stage { width: 340px; height: 340px; } }
</style>
</head>
<body>
<div class="bg-grid"></div>
<h1>Neon Fusion</h1>
<p class="subtitle">Кастомный вариант: неоновое свечение, стеклянные сектора, анимированный фон-сетка, максимум вау-эффекта</p>
<div class="stage">
  <div class="glow-ring"></div>
  <div class="outer-ring"></div>
  <div class="wheel"></div>
  <canvas id="wheel" width="420" height="420"></canvas>
  <div class="center-hub">SPIN</div>
  <div class="pointer">
    <svg viewBox="0 0 40 56" fill="none">
      <path d="M20 56L0 16H40L20 56Z" fill="#ff7b00"/>
      <path d="M20 0L0 16H40L20 0Z" fill="#fff"/>
    </svg>
  </div>
</div>
<div class="controls">
  <button class="spin" onclick="spin(false)">Крутить за бонусы</button>
  <button class="free" onclick="spin(true)">Бесплатно</button>
</div>
<div class="message" id="msg"></div>
<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const sectors = [
  { label: '+50', color: '#0cc0df' },
  { label: 'Free spin', color: '#ff7b00' },
  { label: '+100', color: '#10b981' },
  { label: 'Jackpot', color: '#f59e0b' },
  { label: '+25', color: '#8b5cf6' },
  { label: '+500', color: '#ec4899' },
  { label: '+10', color: '#3b82f6' },
  { label: 'Суперприз', color: '#ef4444' },
];
let rotation = 0;
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size*dpr; canvas.height = size*dpr;
  canvas.style.width = size+'px'; canvas.style.height = size+'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,size,size);
  const cx = size/2, cy = size/2, r = size/2 - 12;
  const step = (Math.PI*2)/sectors.length;
  for (let i=0;i<sectors.length;i++) {
    const start=i*step, end=start+step;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, sectors[i].color+'44');
    grad.addColorStop(0.6, sectors[i].color+'aa');
    grad.addColorStop(1, sectors[i].color);
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(start+step/2);
    ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 15px Inter, sans-serif';
    ctx.shadowColor=sectors[i].color; ctx.shadowBlur=12;
    ctx.fillText(sectors[i].label, r-26, 5);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.stroke();
    ctx.restore();
  }
}
function spin(isFree) {
  const idx = Math.floor(Math.random()*sectors.length);
  const sectorAngle = 360/sectors.length;
  const target = idx*sectorAngle + sectorAngle/2 + (Math.random()*sectorAngle*0.8 - sectorAngle*0.4);
  rotation += 6*360 + (270 - target - (rotation%360));
  canvas.style.transition = 'transform 5.5s cubic-bezier(0.12, 0.75, 0.18, 1)';
  canvas.style.transform = `rotate(${rotation}deg)`;
  setTimeout(() => {
    document.getElementById('msg').textContent = 'Выпало: ' + sectors[idx].label;
  }, 5500);
}
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
