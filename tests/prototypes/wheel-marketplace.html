<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо фортуны — Маркетплейс</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 2rem;
  }
  h1 { font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
  p.sub { color: #a0a0b8; margin-bottom: 2rem; text-align: center; }
  .wheel-stage {
    position: relative;
    width: 420px;
    height: 420px;
    max-width: 90vw;
    max-height: 90vw;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(255, 107, 0, 0.25), inset 0 0 80px rgba(0,0,0,0.4);
  }
  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: transform 5s cubic-bezier(0.15, 0.7, 0.2, 1);
    position: relative;
    z-index: 2;
  }
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 60px;
    z-index: 5;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .pointer svg { width: 100%; height: 100%; }
  .center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 84px;
    height: 84px;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 180deg, #ffd700, #ffaa00, #ffd700);
    border-radius: 50%;
    z-index: 4;
    box-shadow: 0 0 20px rgba(255, 170, 0, 0.6), inset 0 0 12px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: #5a3a00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .rim {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6b00, #ffd700, #ff6b00, #ffd700, #ff6b00);
    z-index: 1;
    filter: blur(1px);
  }
  .rim::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: #151520;
  }
  .controls { margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  button {
    border: none;
    padding: 1rem 2rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .spin { background: linear-gradient(135deg, #ff6b00, #ff3d00); color: #fff; box-shadow: 0 8px 24px rgba(255, 61, 0, 0.35); }
  .spin:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 61, 0, 0.5); }
  .spin:active { transform: translateY(1px); }
  .free { background: transparent; color: #ffd700; border: 2px solid #ffd700; }
  .free:hover { background: rgba(255, 215, 0, 0.08); }
  .message { margin-top: 1.5rem; min-height: 1.5em; font-weight: 700; text-align: center; }
  .message.win { color: #ffd700; }
  @media (max-width: 480px) { .wheel-stage { width: 320px; height: 320px; } }
</style>
</head>
<body>
<h1>Колесо фортуны</h1>
<p class="sub">Вариант «Маркетплейс» — плоское кольцо с яркими секторами, золотым ободом и плавным спином</p>
<div class="wheel-stage">
  <div class="rim"></div>
  <canvas class="wheel" id="wheel" width="420" height="420"></canvas>
  <div class="center-cap">GO</div>
  <div class="pointer">
    <svg viewBox="0 0 44 60" fill="none">
      <path d="M22 0L44 48H0L22 0Z" fill="#ff3d00"/>
      <path d="M22 48L14 60H30L22 48Z" fill="#ffd700"/>
      <circle cx="22" cy="18" r="5" fill="#fff"/>
    </svg>
  </div>
</div>
<div class="controls">
  <button class="spin" onclick="spin(false)">Крутить за бонусы</button>
  <button class="free" onclick="spin(true)">Бесплатно</button>
</div>
<div class="message" id="msg"></div>
<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const sectors = [
  { label: '+50 бонусов', color: '#ff6b00' },
  { label: 'Попробуй ещё', color: '#3b82f6' },
  { label: '+100', color: '#10b981' },
  { label: 'Free spin', color: '#8b5cf6' },
  { label: '+25', color: '#ef4444' },
  { label: 'Суперприз', color: '#f59e0b' },
  { label: '+10', color: '#ec4899' },
  { label: '+500', color: '#0cc0df' },
];
let rotation = 0;
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,size,size);
  const cx = size/2, cy = size/2, r = size/2 - 16;
  const step = (Math.PI*2)/sectors.length;
  for (let i=0;i<sectors.length;i++) {
    const start = i*step, end = start+step;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, sectors[i].color);
    grad.addColorStop(1, adjust(sectors[i].color, -25));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + step/2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=4;
    ctx.fillText(sectors[i].label, r - 26, 5);
    ctx.restore();
  }
}
function adjust(hex, amount) {
  const num = parseInt(hex.slice(1),16);
  let r = (num>>16)+amount, g = ((num>>8)&255)+amount, b = (num&255)+amount;
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
function spin(isFree) {
  const idx = Math.floor(Math.random()*sectors.length);
  const step = 360/sectors.length;
  const target = idx*step + step/2 + (Math.random()*step*0.8 - step*0.4);
  rotation += 5*360 + (270 - target - (rotation%360));
  canvas.style.transform = `rotate(${rotation}deg)`;
  setTimeout(() => {
    const msg = document.getElementById('msg');
    msg.textContent = 'Выпало: ' + sectors[idx].label;
    msg.className = 'message win';
  }, 5000);
}
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
