<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо фортуны — Маркетплейс</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; padding: 2rem 1rem;
  }
  h1 { font-weight: 900; margin-bottom: 0.25rem; text-align: center; font-size: clamp(1.5rem, 5vw, 2.2rem); }
  .sub { color: #a0a0b8; margin-bottom: 1.5rem; text-align: center; font-size: 0.95rem; }
  .stage {
    position: relative;
    width: min(100%, 720px);
    height: 360px;
    perspective: 1000px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .track {
    position: absolute;
    left: 0; top: 50%;
    display: flex; align-items: center;
    gap: 24px;
    transform-style: preserve-3d;
    will-change: transform;
    transform: translateY(-50%);
  }
  .card {
    flex: 0 0 auto;
    width: 220px; height: 280px;
    border-radius: 24px;
    background: linear-gradient(135deg, #2a2a4a, #151530);
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.25rem;
    transition: transform 0.35s ease-out, opacity 0.35s ease-out, filter 0.35s ease-out, border-color 0.35s, box-shadow 0.35s;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .card .visual {
    width: 120px; height: 120px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 4rem;
    margin-bottom: 1rem;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.3);
  }
  .card .label {
    font-weight: 900; font-size: 1.15rem; text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .card .sub-label {
    font-size: 0.8rem; color: #a0a0b8; margin-top: 0.4rem; text-align: center;
  }
  .card.active {
    border-color: rgba(255,255,255,0.35);
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.25), 0 12px 40px rgba(0,0,0,0.5);
  }
  .pointer {
    position: absolute;
    left: 50%; top: -10px;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 28px solid #ffd700;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    z-index: 10;
  }
  .controls { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  button {
    border: none; padding: 1rem 2.5rem; border-radius: 999px; font-size: 1.05rem; font-weight: 900;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .spin { background: linear-gradient(135deg, #ff6b00, #ff3d00); color: #fff; box-shadow: 0 8px 24px rgba(255, 61, 0, 0.35); }
  .spin:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 61, 0, 0.5); }
  .spin:active { transform: translateY(1px); }
  .free { background: transparent; color: #ffd700; border: 2px solid #ffd700; }
  .free:hover { background: rgba(255, 215, 0, 0.08); }
  .message { margin-top: 1.5rem; min-height: 1.5em; font-weight: 800; text-align: center; font-size: 1.2rem; }
  .message.win { color: #ffd700; }
  @media (max-width: 480px) {
    .stage { height: 320px; }
    .card { width: 180px; height: 240px; }
    .card .visual { width: 90px; height: 90px; font-size: 3rem; }
  }
</style>
</head>
<body>
<h1>Колесо фортуны</h1>
<p class="sub">Вариант «Маркетплейс» — карусель призов с плавной инерцией</p>
<div class="stage">
  <div class="pointer"></div>
  <div class="track" id="track"></div>
</div>
<div class="controls">
  <button class="spin" onclick="spin(false)">Крутить за бонусы</button>
  <button class="free" onclick="spin(true)">Бесплатно</button>
</div>
<div class="message" id="msg"></div>

<script>
const items = [
  { label: '+50 бонусов', sub: 'Маленький бонус', color: '#ff6b00', icon: '💰' },
  { label: 'Попробуй ещё', sub: 'Следующий раз', color: '#3b82f6', icon: '🔄' },
  { label: '+100', sub: 'Бонус', color: '#10b981', icon: '💎' },
  { label: 'Free spin', sub: 'Ещё одна попытка', color: '#8b5cf6', icon: '🎁' },
  { label: '+25', sub: 'Бонус', color: '#ef4444', icon: '🔥' },
  { label: 'Суперприз', sub: 'Крупный бонус', color: '#f59e0b', icon: '👑' },
  { label: '+10', sub: 'Бонус', color: '#ec4899', icon: '💵' },
  { label: '+500', sub: 'Джекпот', color: '#0cc0df', icon: '🏆' },
];
const track = document.getElementById('track');
const cardWidth = 220 + 24; // width + gap
const clones = 5;
let offset = 0;
let activeIndex = 0;
let spinning = false;

function buildCards() {
  const list = [];
  for (let i = 0; i < items.length * clones; i++) {
    const item = items[i % items.length];
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="visual" style="background: radial-gradient(circle at 30% 30%, ${item.color}, ${darken(item.color, 40)})">${item.icon}</div>
      <div class="label" style="color:${item.color}">${item.label}</div>
      <div class="sub-label">${item.sub}</div>
    `;
    track.appendChild(div);
    list.push(div);
  }
  return list;
}
const cards = buildCards();

function darken(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.max(0, (num >> 16) - amount);
  let g = Math.max(0, ((num >> 8) & 255) - amount);
  let b = Math.max(0, (num & 255) - amount);
  return `rgb(${r},${g},${b})`;
}

function centerOffset(index) {
  const stageWidth = track.parentElement.clientWidth;
  return stageWidth / 2 - (index * cardWidth + 220 / 2);
}

function updateCards() {
  const stageRect = track.parentElement.getBoundingClientRect();
  const center = stageRect.width / 2;
  cards.forEach((card, i) => {
    const cardRect = card.getBoundingClientRect();
    const cardCenter = cardRect.left + cardRect.width / 2 - stageRect.left;
    const dist = (cardCenter - center) / (cardRect.width + 24);
    const absDist = Math.min(3, Math.abs(dist));
    const scale = Math.max(0.78, 1 - absDist * 0.18);
    const opacity = Math.max(0.45, 1 - absDist * 0.45);
    const blur = Math.min(4, absDist * 2.5);
    card.style.transform = `scale(${scale})`;
    card.style.opacity = opacity;
    card.style.filter = `blur(${blur}px)`;
    card.classList.toggle('active', absDist < 0.4);
  });
}

function spin(isFree) {
  if (spinning) return;
  spinning = true;
  const targetIdx = Math.floor(Math.random() * items.length);
  const loops = 4 + Math.floor(Math.random() * 2);
  const finalCardIndex = items.length * loops + targetIdx;
  const finalOffset = centerOffset(finalCardIndex);
  const startOffset = offset;
  const distance = finalOffset - startOffset;
  const duration = 5500;
  const start = performance.now();

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3.5);
    offset = startOffset + distance * eased;
    track.style.transform = `translateY(-50%) translateX(${offset}px)`;
    updateCards();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      activeIndex = targetIdx;
      document.getElementById('msg').textContent = 'Выпало: ' + items[targetIdx].label;
      document.getElementById('msg').className = 'message win';
    }
  }
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  offset = centerOffset(activeIndex);
  track.style.transform = `translateY(-50%) translateX(${offset}px)`;
  updateCards();
});

offset = centerOffset(0);
track.style.transform = `translateY(-50%) translateX(${offset}px)`;
updateCards();
</script>
</body>
</html>
