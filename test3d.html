<!DOCTYPE html>
<html><head><style>
body { margin:0; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; }
.scene { perspective: 1400px; width: 420px; height: 585px; }
.cube { width: 420px; height: 585px; position: relative; transform-style: preserve-3d; transform: rotateY(25deg) rotateX(-5deg); }
.face { position: absolute; top: 50%; left: 50%; border: 2px solid #6b7280; box-sizing: border-box; }
.front { width: 420px; height: 585px; transform: translateX(-50%) translateY(-50%) translateZ(45px); background: transparent; border: none; overflow: hidden; border-radius: 15px; }
.back { width: 420px; height: 585px; transform: translateX(-50%) translateY(-50%) rotateY(180deg) translateZ(45px); background: #d1d5db; border-radius: 15px; }
.left { width: 90px; height: 585px; transform: translateX(-50%) translateY(-50%) rotateY(-90deg) translateZ(210px); background: #e5e7eb; border-radius: 15px; }
.right { width: 90px; height: 585px; transform: translateX(-50%) translateY(-50%) rotateY(90deg) translateZ(210px); background: #d1d5db; border-radius: 15px; }
.top { width: 420px; height: 90px; transform: translateX(-50%) translateY(-50%) rotateX(90deg) translateZ(292.5px); background: #f3f4f6; border-radius: 15px; }
.bottom { width: 420px; height: 90px; transform: translateX(-50%) translateY(-50%) rotateX(-90deg) translateZ(292.5px); background: #9ca3af; border-radius: 15px; }
svg { width:100%; height:100%; display:block; }
rect { fill: rgba(12,192,223,0.18); stroke: #4b5563; stroke-width: 2; }
.red { fill: red; }
</style></head>
<body>
<div class="scene">
<div class="cube">
<div class="face front">
<svg viewBox="90 70 280 390" xmlns="http://www.w3.org/2000/svg">
<rect x="90" y="70" width="280" height="390" rx="10" />
<rect class="red" x="150" y="150" width="100" height="100" />
</svg>
</div>
<div class="face back"></div>
<div class="face left"></div>
<div class="face right"></div>
<div class="face top"></div>
<div class="face bottom"></div>
</div>
</div>
</body></html>
